name: CI

on:
  push:
    branches: [main, frontend]
  pull_request:
    branches: [main, frontend]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://mock-supabase.supabase.co
      SUPABASE_ANON_KEY: mock-anon-key-placeholder
      SUPABASE_JWT_SECRET: mock-jwt-secret-min-32-chars-length-1234567890
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODEL: gemini-2.0-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations (Alembic)
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run pytest test suite
        working-directory: backend
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run production build (tsc -b && vite build)
        working-directory: frontend
        run: |
          npm run build
